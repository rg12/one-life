// Module-level stat applicator (safe to call from data-table resolve functions)
function applyFx(c, fx) {
  if (!fx) return;
  ["health", "smarts", "looks", "happiness", "reputation"].forEach(k => {
    if (fx[k] !== undefined) c.stats[k] = clamp(c.stats[k] + fx[k]);
  });
  if (fx.cash !== undefined) c.cash += fx.cash;
}

}

/* Filter companies you're eligible to be hired at.
   Prestige > score + 15 = out of reach.
   Prestige within score band = eligible.
   Cap the top: even prestige 90 firms hire fresh grads if their score is high. */
function eligibleCompanies(c, industryKey, score) {
  const list = COMPANIES[industryKey] || [];
  return list.filter(co => co.prestige <= score + 15);
}
function pickStartingCompany(c, industryKey, score) {
  const eligible = eligibleCompanies(c, industryKey, score);
  if (eligible.length === 0) return COMPANIES[industryKey][COMPANIES[industryKey].length - 1];
  // weight by prestige — higher-scoring people bias toward higher-prestige firms, but not deterministic
  const weighted = eligible.map(co => ({
    co,
    w: Math.max(1, 100 - Math.abs(score - co.prestige))
  }));
  const total = weighted.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  for (const {
    co,
    w
  } of weighted) {
    r -= w;
    if (r <= 0) return co;
  }
  return eligible[0];
}
function jobForIndustry(c, industryKey, useGrad, companyOverride) {
  const ind = INDUSTRIES[industryKey];
  const ladder = useGrad && ind.grad ? ind.grad : ind.direct;
  if (!ladder) return null;
  const score = driveScore(c, ind);
  let chosen = ladder[0];
  for (const t of ladder) if (score >= t.min) chosen = t;
  const ladderIdx = ladder.indexOf(chosen);
  const company = companyOverride || pickStartingCompany(c, industryKey, score);
  return {
    industry: industryKey,
    company: company.key,
    title: chosen.title,
    salary: Math.round(chosen.salary * company.payMult),
    ladderIdx,
    useGrad,
    yearsAtCompany: 0
  };
}
function getCompany(industryKey, companyKey) {
  return (COMPANIES[industryKey] || []).find(c => c.key === companyKey);
}

function computeLegacyScore(c) {
  // Wealth (0–25)
  const nw = c.netWorthPeak;
  const wealthPts = nw >= 10000000 ? 25 : nw >= 1000000 ? 22 : nw >= 500000 ? 17 : nw >= 100000 ? 11 : nw >= 10000 ? 5 : 2;
  // Power (0–25)
  const nt = c.politics.termsServed;
  const powerPts = nt.national >= 2 ? 25 : nt.national >= 1 ? 20 : nt.governor >= 1 ? 13 : nt.mayor >= 1 ? 7 : nt.council >= 1 ? 3 : 0;
  // Happiness (0–25)
  const happPts = Math.round(c.stats.happiness / 4);
  // Love (0–25)
  let lovePts = 0;
  if (c.rel.stage === "married") lovePts += 12;else if (c.rel.stage === "widowed") lovePts += 9;else if (c.rel.stage === "divorced") lovePts += 3;
  lovePts += Math.min(8, Math.floor((c.rel.partner?.yearsTogether || 0) / 3));
  lovePts += Math.min(5, c.rel.kids.length * 2);
  const loveFinal = Math.min(25, Math.round(lovePts));
  return Math.min(100, wealthPts + powerPts + happPts + loveFinal);
}

function OneLifeDossier() {
  const [screen, setScreen] = useState("intro"); // intro | create | play | dead

  const [campaignSpend, setCampaignSpend] = useState("");

  const [showStakes, setShowStakes] = useState(false);
  const [showLifestyle, setShowLifestyle] = useState(false);
  const [activeTab, setActiveTab] = useState("life");
  const [showLog, setShowLog] = useState(false);
  const [crewHireInput, setCrewHireInput] = useState("");
  const [assetCategory, setAssetCategory] = useState("vehicles");
  const [donateInput, setDonateInput] = useState("");
  const [stakeInput, setStakeInput] = useState("");
  const [investInputs, setInvestInputs] = useState({
    stocks: "",
    gold: "",
    mf: ""
  });
  const [geoActionTarget, setGeoActionTarget] = useState(null);
  const [legacyData, setLegacyData] = useState(null);
  const logEndRef = useRef(null);

  /* ---------------- creation flow ---------------- */

  function rollFamily() {
    setRolling(true);
    let ticks = 0;
    const iv = setInterval(() => {
      setDiceValue(1 + Math.floor(Math.random() * 6));
      ticks++;
      if (ticks > 10) {
        clearInterval(iv);
        const finalRoll = 1 + Math.floor(Math.random() * 6);
        setDiceValue(finalRoll);
        const tierIdx = finalRoll <= 2 ? 0 : finalRoll <= 4 ? 1 : 2;
        const type = pick(FAMILY_TYPES);
        setRolledFamily({
          tier: WEALTH_TIERS[tierIdx],
          type
        });
        setRolling(false);
      }
    }, 90);
  }
  function beginLife() {
    if (!rolledFamily) return;
    const {
      tier,
      type
    } = rolledFamily;
    const stats = {
      health: clamp(70 + (type.health || 0)),
      smarts: clamp(50 + (tier.smarts || 0) + (type.smarts || 0)),
      looks: clamp(50 + (tier.looks || 0)),
      happiness: clamp(70 + (tier.happiness || 0) + (type.happiness || 0)),
      reputation: clamp(30 + (type.reputation || 0))
    };
    setChar({
      ...FRESH_CHAR(),
      name: nameInput.trim() || "The Kid",
      cash: tier.cash,
      family: {
        wealth: tier.label,
        type: type.label
      },
      stats,
      log: [{
        age: 0,
        text: `Born into a ${type.label.toLowerCase()} ${tier.label.toLowerCase()} family.`,
        tone: "neutral"
      }]
    });
    setScreen("play");
  }

  /* ---------------- log helper ---------------- */

  function pushLog(c, entries) {
    const list = Array.isArray(entries) ? entries : [entries];
    const stamped = list.map(e => ({
      age: c.age,
      ...e
    }));
    c.log = [...stamped.reverse(), ...c.log].slice(0, 60);
  }
  function applyEffects(c, fx) {
    if (!fx) return;
    const keys = ["health", "smarts", "looks", "happiness", "reputation"];
    keys.forEach(k => {
      if (fx[k]) c.stats[k] = clamp(c.stats[k] + fx[k]);
    });
    if (fx.cash) c.cash += fx.cash;
  }

  /* ---------------- decisions ---------------- */

  function resolveTraitChoice(traitKey) {
    setChar(prev => {
      const c = structuredClone(prev);
      const t = TRAITS[traitKey];
      c.traits = [traitKey];
      applyEffects(c, t);
      pushLog(c, {
        text: `You leaned into being ${t.label.toLowerCase()}. ${t.desc}`,
        tone: "trait"
      });
      return c;
    });
    setPendingDecision(null);
  }
  function resolvePathChoice(pathKey) {
    let goToIndustry = false;
    let goToSpec = null;
    let fromCollege = false;
    setChar(prev => {
      const c = structuredClone(prev);
      if (pathKey === "college") {
        c.path = "college";
        c.collegeYearsLeft = 4;
        pushLog(c, {
          text: "You enrolled in college, chasing a degree and a future.",
          tone: "path"
        });
      } else if (pathKey === "job") {
        goToIndustry = true;
      } else if (pathKey === "business" || pathKey === "sports" || pathKey === "arts") {
        goToSpec = pathKey;
      }
      return c;
    });
    if (goToSpec) {
      setTimeout(() => setPendingDecision({
        type: "specialization",
        pathKey: goToSpec
      }), 0);
    } else if (goToIndustry) {
      setTimeout(() => setPendingDecision({
        type: "industry",
        fromCollege
      }), 0);
    } else {
      setPendingDecision(null);
    }
  }
  function resolveSpecialization(pathKey, specKey) {
    let fallbackToIndustry = false;
    setChar(prev => {
      const c = structuredClone(prev);
      const hasTrait = k => c.traits.includes(k);
      if (pathKey === "sports") {
        const spec = SPORTS[specKey];
        const chance = spec.tryoutBase + (hasTrait("sporty") ? 0.30 : 0) + (c.stats.health - 50) / 220;
        if (Math.random() < chance) {
          c.path = "sports";
          c.specialization = specKey;
          pushLog(c, {
            text: `You made it as a professional ${spec.label.toLowerCase()} player. Signed, sponsored, in.`,
            tone: "path"
          });
        } else {
          pushLog(c, {
            text: `Your ${spec.label.toLowerCase()} tryouts didn't go your way. You'll pick a field to work in instead.`,
            tone: "path"
          });
          fallbackToIndustry = true;
        }
      } else if (pathKey === "arts") {
        const spec = ARTS[specKey];
        const chance = spec.auditionBase + (hasTrait("notorious") ? 0.30 : 0) + (c.stats.reputation - 30) / 220;
        if (Math.random() < chance) {
          c.path = "arts";
          c.specialization = specKey;
          pushLog(c, {
            text: `You broke in as a ${spec.label.toLowerCase()}. Your first real work is out in the world.`,
            tone: "path"
          });
        } else {
          pushLog(c, {
            text: `The world wasn't ready for your ${spec.label.toLowerCase()} yet. You'll pick a field to work in instead.`,
            tone: "path"
          });
          fallbackToIndustry = true;
        }
      } else if (pathKey === "business") {
        const type = BUSINESS_TYPES[specKey];
        if (c.cash < type.capital) {
          pushLog(c, {
            text: `Couldn't raise the ${money(type.capital)} to start a ${type.label.toLowerCase()}. You'll pick a field to work in instead.`,
            tone: "path"
          });
          fallbackToIndustry = true;
        } else {
          c.cash -= type.capital;
          c.path = "business";
          c.specialization = specKey;
          c.businessLevel = 1;
          pushLog(c, {
            text: `You put ${money(type.capital)} of your own money into founding a ${type.label.toLowerCase()}.`,
            tone: "path"
          });
        }
      }
      return c;
    });
    if (fallbackToIndustry) {
      setTimeout(() => setPendingDecision({
        type: "industry",
        fromCollege: false
      }), 0);
    } else {
      setPendingDecision(null);
    }
  }
  function resolveIndustryChoice(industryKey) {
    setChar(prev => {
      const c = structuredClone(prev);
      const fromCollege = pendingDecision?.fromCollege;
      const ind = INDUSTRIES[industryKey];
      const useGrad = !!fromCollege && !!ind.grad;
      c.path = "job";
      c.job = jobForIndustry(c, industryKey, useGrad);
      const co = getCompany(c.job.industry, c.job.company);
      pushLog(c, {
        text: `You entered ${ind.label} as a ${c.job.title} at ${co.label}.`,
        tone: "path"
      });
      return c;
    });
    setPendingDecision(null);
  }

  /* ---------------- job hopping ---------------- */

  function openJobHunt() {
    if (!char.job || char.jobHopCooldown > 0) return;
    setPendingDecision({
      type: "job_hunt"
    });
  }
  function acceptJobOffer(companyKey) {
    setChar(prev => {
      const c = structuredClone(prev);
      if (!c.job) return prev;
      const co = getCompany(c.job.industry, companyKey);
      if (!co) return prev;
      const oldCo = getCompany(c.job.industry, c.job.company);
      // moving to a higher-prestige firm gives a rep + salary bump; same/lower is mostly a lateral
      const isUpmove = co.prestige > (oldCo?.prestige || 0);
      const newSalary = Math.round(c.job.salary * (co.payMult / (oldCo?.payMult || 1)) * (isUpmove ? 1.15 : 1.05));
      c.job = {
        ...c.job,
        company: co.key,
        salary: newSalary,
        yearsAtCompany: 0
      };
      if (isUpmove) applyEffects(c, {
        reputation: 3
      });
      c.jobHopCooldown = 3;
      pushLog(c, {
        text: `You joined ${co.label} as a ${c.job.title}. New salary: ${money(newSalary)}/yr.`,
        tone: "path"
      });
      return c;

    setPendingDecision(null);

  function declineOffer() {
    setChar(prev => {

        tone: "neutral"

      return c;
    });
    setPendingDecision(null);

  /* ---------------- politics: elections, laws, parties ---------------- */

  function eligibleTiers(c) {
    return POLITICAL_TIERS.filter(t => {
      if (c.age < 25) return false;
      if (c.politics.electionCooldown > 0) return false;
      if (t.prereq && c.politics.termsServed[t.prereq] < 1) return false;
      if (t.termLimit && c.politics.termsServed[t.key] >= t.termLimit) return false;
      const isPartyPres = c.party.affiliation && c.party.rankIdx >= 3;
      const isPartyMember = !!c.party.affiliation;
      const meetsRep = c.stats.reputation >= t.repReq;
      const meetsPop = c.politics.popularity >= t.popReq;
      // Independent runs at Governor+ need much more popularity to compensate
      const independentPenalty = !isPartyMember && (t.key === "governor" || t.key === "national") ? 15 : 0;
      const requiredPop = t.popReq + independentPenalty;
      // Party president gets a break at the top tier
      if (t.key === "national" && isPartyPres) {
        return meetsRep && c.politics.popularity >= t.popReq - 10;
      }
      return meetsRep && c.politics.popularity >= requiredPop;
    });
  }

  /* ─── Campaign system ─────────────────────────────────────────── */

  function runForOffice(tierKey, isReelection = false) {
    // Pick a rival from opposing party (or any if independent)
    const myParty = char.party.affiliation;
    const pool = RIVAL_POLITICIANS.filter(r => r.party !== myParty);
    const rival = pool[Math.floor(Math.random() * pool.length)];
    setChar(prev => {
      const c = structuredClone(prev);
      c.campaign = {
        active: true,
        tierKey,
        rival,
        actionsLeft: 3,
        bonusChance: 0,
        rivalDebuff: 0,
        isReelection,
        pledgedLaw: null

      c.politics.currentRival = rival.name;
      return c;
    });
    setPendingDecision({
      type: "campaign_action"

  }
  function takeCampaignAction(actionKey, pledgedLawKey) {
    setChar(prev => {
      const c = structuredClone(prev);
      const act = CAMPAIGN_ACTIONS.find(a => a.key === actionKey);
      if (!act) return prev;

      // Deduct cost
      const cost = act.cost || 0;
      if (c.cash < cost) return prev;
      c.cash -= cost;

      // Calculate bonus chance
      const statBonus = act.statKey ? (c.stats[act.statKey] - 50) / (act.statDiv || 400) : 0;
      const bonus = (act.bonusBase || 0) + Math.max(0, statBonus);
      c.campaign.bonusChance = (c.campaign.bonusChance || 0) + bonus;
      c.campaign.rivalDebuff = (c.campaign.rivalDebuff || 0) + (act.rivalDebuff || 0);

      // Popularity bump
      if (act.popularityGain) c.politics.popularity = clamp(c.politics.popularity + act.popularityGain);

      // Promise binds you to a law
      if (act.requiresLawChoice && pledgedLawKey) {
        c.campaign.pledgedLaw = pledgedLawKey;
        c.politics.campaignPledge = pledgedLawKey;

      // Attack backfire
      if (act.reputationRisk && Math.random() < 0.25) {

        pushLog(c, {
          text: "Your attack ad backfired — press called it desperate.",

      pushLog(c, {
        text: `Campaign: ${act.label}. Momentum building.`,
        tone: "politics"

      return c;
    });

    // More actions, or go to election day
    setChar(prev => {
      if ((prev.campaign.actionsLeft || 0) > 0) {

        });

        });

  function resolveElectionDay() {

      const rival = c.campaign.rival;
      const party = c.party.affiliation ? POLITICAL_PARTIES[c.party.affiliation] : null;

      // Party contribution based on rank
      let partyContrib = 0;
      if (party && c.party.standing > 20) {

        c.cash += 0; // party funds go directly to boost

      // Build win chance from all sources
      let chance = 0.20 + (c.stats.reputation - tier.repReq) / 180 + (c.politics.popularity - tier.popReq) / 200 + c.stats.smarts / 500 + (c.campaign.bonusChance || 0) + (party ? 0.08 + c.party.standing / 400 : 0);
      if (c.campaign.isReelection) chance += (c.politics.approval - 50) / 150;
      if (!party && (tier.key === "governor" || tier.key === "national")) chance -= 0.18;

      // Rival debuff (your attack ads and debates)
      const rivalPop = (rival?.pop || 50) - Math.round((c.campaign.rivalDebuff || 0) * 100);
      const rivalChance = Math.max(0.10, rivalPop / 100);
      const finalChance = Math.max(0.05, Math.min(0.92, chance));
      const won = Math.random() < finalChance;
      if (won) {
        // PM election: coalition check
        if (tier.key === "national" && !party) {
          // Independent PM needs supermajority — harder
        }
        if (tier.key === "national" && party && Math.random() < 0.40) {
          // No majority — need coalition
          const others = Object.values(POLITICAL_PARTIES).filter(p => p.key !== party.key);
          const partner = others[Math.floor(Math.random() * others.length)];
          c.campaign.active = false;
          setPendingDecision({
            type: "coalition",
            tierKey,
            partner
          });
          return c;
        }

        // Clean win
        c.politics.office = tier.key;
        c.politics.termYearsLeft = tier.termLength;
        c.politics.approval = 58;
        c.politics.termsServed[tier.key] += 1;
        c.politics.lawProposedThisTerm = false;
        c.politics.electionCooldown = 0;
        c.politics.popularity = clamp(c.politics.popularity + tier.popularityBoost);
        if (party && c.party.rankIdx < 1) c.party.rankIdx = 1;
        if (c.campaign.pledgedLaw) c.politics.campaignPledge = c.campaign.pledgedLaw;
        const note = party ? ` (${party.short} backed the campaign)` : " (ran as Independent)";
        pushLog(c, {
          text: `Election won. You defeated ${rival?.name || "your opponent"} and were sworn in as ${tier.label}${note}.`,
          tone: "politics"
        });
      } else {
        c.politics.electionCooldown = 1;
        if (c.campaign.isReelection) {
          c.politics.office = null;
          c.politics.termYearsLeft = 0;
        }
        applyEffects(c, {
          reputation: -4

        c.politics.popularity = clamp(c.politics.popularity - 5);
        if (party) c.party.standing = clamp(c.party.standing - 8, -100, 100);
        pushLog(c, {
          text: `Election lost to ${rival?.name || "your opponent"}. The campaign hurt more than it helped.`,
          tone: "politics"
        });

        active: false,
        tierKey: null,
        rival: null,
        actionsLeft: 3,
        bonusChance: 0,
        rivalDebuff: 0,
        isReelection: false,
        pledgedLaw: null

    });

  /* ---------------- geopolitics ---------------- */

  function openForeignAction(actionKey) {
    const action = FOREIGN_ACTIONS.find(a => a.key === actionKey);
    if (!action) return;
    if (action.targetted) {
      setPendingDecision({
        type: "geo_target",
        actionKey
      });
    } else {
      executeForeignAction(actionKey, null);
    }
  }
  function executeForeignAction(actionKey, targetPower) {
    setChar(prev => {
      const c = structuredClone(prev);
      const action = FOREIGN_ACTIONS.find(a => a.key === actionKey);
      if (!action) return prev;
      const fx = action.effect(targetPower ? c.geo.relations[targetPower] : 0);

      // apply cost
      if (c.cash < (action.cost || 0)) return prev;
      c.cash -= action.cost || 0;

      // backfire check
      if (action.backfireChance && Math.random() < action.backfireChance) {
        const bf = action.backfire;
        if (bf.relations && targetPower) c.geo.relations[targetPower] = clamp(c.geo.relations[targetPower] + bf.relations, -100, 100);
        if (bf.prestige) c.geo.prestige = clamp(c.geo.prestige + bf.prestige);
        if (bf.popularityDelta) c.politics.popularity = clamp(c.politics.popularity + bf.popularityDelta);
        if (bf.approval) c.politics.approval = clamp(c.politics.approval + bf.approval);
        pushLog(c, {
          text: `Your covert operation was exposed. Diplomatic fallout.`,
          tone: "politics"
        });
        return c;
      }

      // apply effects on target
      if (targetPower) {
        c.geo.relations[targetPower] = clamp(c.geo.relations[targetPower] + (fx.relations || 0), -100, 100);
        const power = WORLD_POWERS[targetPower];
        if (power?.rivalOf && fx.relations > 0 && action.rivalEffect) {
          c.geo.relations[power.rivalOf] = clamp(c.geo.relations[power.rivalOf] + action.rivalEffect, -100, 100);
        }
        if (actionKey === "trade_deal" || actionKey === "defense_pact") {
          const boost = fx.economy || 0;
          c.geo.activeDeals = [...c.geo.activeDeals.filter(d => !(d.power === targetPower && d.type === actionKey)), {
            power: targetPower,
            type: actionKey,
            yearsLeft: fx.economyYears || 4,
            economyBoost: boost
          }];
        }
        if (actionKey === "sanctions") {
          c.geo.activeDeals = c.geo.activeDeals.filter(d => d.power !== targetPower);
        }
      } else {
        Object.keys(c.geo.relations).forEach(pk => {
          c.geo.relations[pk] = clamp(c.geo.relations[pk] + (fx.relations || 0), -100, 100);
        });
      }
      if (fx.prestige) c.geo.prestige = clamp(c.geo.prestige + fx.prestige);
      if (fx.popularityDelta) c.politics.popularity = clamp(c.politics.popularity + fx.popularityDelta);
      if (fx.approval) c.politics.approval = clamp(c.politics.approval + fx.approval);
      if (fx.smarts) applyEffects(c, {
        smarts: fx.smarts
      });
      if (fx.economy && !targetPower) {
        c.politics.economyModifier = fx.economy;
        c.politics.economyYearsLeft = fx.economyYears || 2;
      }
      if (actionKey === "aid" || actionKey === "summit") c.geo.peacePolicies = (c.geo.peacePolicies || 0) + 1;
      const pw = targetPower ? WORLD_POWERS[targetPower].short : "all";
      pushLog(c, {
        text: `Foreign policy: ${action.label}${targetPower ? " with " + WORLD_POWERS[targetPower].label : ""}. Prestige: ${c.geo.prestige}.`,
        tone: "politics"
      });
      return c;
    });
    setPendingDecision(null);
    setGeoActionTarget(null);
  }
  function respondToCrisis(crisisKey, optionIdx) {
    setChar(prev => {
      const c = structuredClone(prev);

      if (!crisis) return prev;
      const opt = crisis.options[optionIdx];
      const fx = opt.effects;

      // backfire check
      if (fx.backfireChance && Math.random() < fx.backfireChance) {
        const bf = fx.backfire;
        if (bf.economy) {
          c.politics.economyModifier = bf.economy;
          c.politics.economyYearsLeft = bf.economyYears || 2;
        }
        if (bf.popularityDelta) c.politics.popularity = clamp(c.politics.popularity + bf.popularityDelta);
        if (bf.approval) c.politics.approval = clamp(c.politics.approval + bf.approval);

        if (bf.health) applyEffects(c, {
          health: bf.health
        });
        pushLog(c, {
          text: `Crisis: ${crisis.headline} — your response backfired badly.`,
          tone: "politics"
        });
        setPendingDecision(null);
        return c;
      }
      if (fx.relations && fx.targetPower) {
        c.geo.relations[fx.targetPower] = clamp(c.geo.relations[fx.targetPower] + fx.relations, -100, 100);
      } else if (fx.relations) {
        Object.keys(c.geo.relations).forEach(pk => {
          c.geo.relations[pk] = clamp(c.geo.relations[pk] + Math.round(fx.relations / 3), -100, 100);
        });
      }
      if (fx.prestige) c.geo.prestige = clamp(c.geo.prestige + fx.prestige);
      if (fx.popularityDelta) c.politics.popularity = clamp(c.politics.popularity + fx.popularityDelta);
      if (fx.approval) c.politics.approval = clamp(c.politics.approval + fx.approval);
      if (fx.economy) {
        c.politics.economyModifier = (c.politics.economyModifier || 0) + fx.economy;
        c.politics.economyYearsLeft = Math.max(c.politics.economyYearsLeft || 0, fx.economyYears || 2);
      }
      if (fx.cash) c.cash += fx.cash;
      if (fx.smarts) applyEffects(c, {
        smarts: fx.smarts
      });
      if (fx.reputation) applyEffects(c, {
        reputation: fx.reputation
      });
      if (opt.effects.aid || optionIdx === 0 && crisisKey === "climate_summit") c.geo.peacePolicies = (c.geo.peacePolicies || 0) + 1;

      // war risk
      if (fx.warRisk && Math.random() < fx.warRisk) {
        const warPower = Object.keys(c.geo.relations).find(pk => c.geo.relations[pk] < -20 && !c.geo.warsWith.find(w => w.power === pk)) || "federation";
        if (!c.geo.warsWith.find(w => w.power === warPower)) {
          c.geo.warsWith = [...c.geo.warsWith, {
            power: warPower,
            yearsIn: 0
          }];
          pushLog(c, {
            text: `War broke out with ${WORLD_POWERS[warPower].label}. The world holds its breath.`,
            tone: "politics"
          });
        }
      }
      pushLog(c, {
        text: `Crisis resolved: ${crisis.headline} — you chose "${opt.label}".`,
        tone: "politics"
      });
      return c;
    });
    setPendingDecision(null);
  }

  /* ---------------- investments ---------------- */

  function invest(kind, sign) {
    const amt = Number(investInputs[kind]);
    if (!amt || amt <= 0) return;
    setChar(prev => {
      const c = structuredClone(prev);
      if (sign > 0) {
        if (c.cash < amt) return prev;
        c.cash -= amt;
        c.investments[kind] += amt;
      } else {
        const withdrawAmt = Math.min(amt, c.investments[kind]);
        c.investments[kind] -= withdrawAmt;
        c.cash += withdrawAmt;
      }
      return c;
    });
    setInvestInputs(p => ({
      ...p,
      [kind]: ""
    }));
  }

  /* ---------------- business stakes ---------------- */

  function buyStake(typeKey) {
    const amt = Number(stakeInput);
    if (!amt || amt <= 0) return;
    const bt = BUSINESS_STAKE_TYPES[typeKey];
    if (!bt || amt < bt.minStake) return;
    setChar(prev => {
      const c = structuredClone(prev);
      if (c.cash < amt) return prev;
      if ((c.businessStakes || []).length >= 4) return prev;

      c.businessStakes = [...(c.businessStakes || []), {
        type: typeKey,
        equity: amt,
        yearsHeld: 0,
        currentValue: amt
      }];
      pushLog(c, {
        text: `Acquired a ${bt.label} stake for ${money(amt)}.`,
        tone: "money-up"
      });
      return c;
    });
    setStakeInput("");
    setPendingDecision(null);
  }
  function sellStake(idx) {
    setChar(prev => {

  function runCrimeOp(opKey) {
    setChar(prev => {
      const c = structuredClone(prev);
      const op = CRIME_OPS.find(o => o.key === opKey);
      if (!op || op.minRank > c.underworld.rank) return prev;
      if (op.isLaunder) {
        if (c.underworld.dirtyMoney <= 0) return prev;
        const maxLaunder = Math.min(c.underworld.dirtyMoney, 30000);
        const hasRealEstate = c.businessStakes.some(s => s.type === "realestate");
        const rate = hasRealEstate ? 0.80 : 0.70;
        const cleaned = Math.round(maxLaunder * rate);
        c.underworld.dirtyMoney -= maxLaunder;
        c.cash += cleaned;
        c.underworld.heat = clamp(c.underworld.heat + op.heatGain);
        pushLog(c, {
          text: `Money laundering cleaned ${money(maxLaunder)} → ${money(cleaned)} (${Math.round(rate * 100)}% rate).`,
          tone: "money-up"
        });
        return c;
      }
      if (op.isBribe) {
        const bribeAmt = 2000 + c.underworld.heat * 80;
        if (c.cash < bribeAmt) return prev;
        c.cash -= bribeAmt;
        const heatReduction = Math.round(15 + c.underworld.rank * 4);
        c.underworld.heat = clamp(c.underworld.heat - heatReduction);
        if (c.politics.office) c.politics.approval = clamp(c.politics.approval + 3);
        pushLog(c, {
          text: `Paid ${money(bribeAmt)} in bribes. Heat dropped by ${heatReduction}.`,
          tone: "politics"
        });
        return c;
      }
      const dirty = Math.round(op.dirtyMin + Math.random() * (op.dirtyMax - op.dirtyMin));
      const traitBonus = c.traits.includes("notorious") ? 1.15 : 1;
      const rankBonus = 1 + (c.underworld.rank - 1) * 0.10;
      const crewBonus = 1 + c.underworld.crewSize / 200;
      const totalDirty = Math.round(dirty * traitBonus * rankBonus * crewBonus);
      c.underworld.dirtyMoney += totalDirty;
      c.underworld.heat = clamp(c.underworld.heat + op.heatGain);
      if (Math.random() < op.riskChance) {
        const heatSpike = Math.round(8 + Math.random() * 12);
        c.underworld.heat = clamp(c.underworld.heat + heatSpike);
        applyEffects(c, {
          reputation: -4
        });
        pushLog(c, {
          text: `${op.label} — went sideways. Heat +${heatSpike}. Earned ${money(totalDirty)} dirty.`,
          tone: "money-down"
        });
      } else {
        pushLog(c, {
          text: `${op.label} — clean run. Earned ${money(totalDirty)} dirty.`,
          tone: "money-up"
        });
      }
      return c;
    });
    setPendingDecision(null);
  }

  function releaseMusic(type) {
    setChar(prev => {
      const c = structuredClone(prev);
      const isAlbum = type === "album";
      const cost = isAlbum ? 20000 : 2000;
      if (c.cash < cost) return prev;
      c.cash -= cost;
      const label = ARTS_LABELS.find(l => l.key === c.artsCareer.label) || ARTS_LABELS[0];
      const isCreative = c.traits.includes("creative");
      const title = isAlbum ? genAlbumTitle() : genSongTitle();

      // Hit quality check
      const quality = c.artsCareer.fame / 2 + c.stats.smarts / 4 + c.artsCareer.streakHits * 5 + (c.artsCareer.nextWorkBonus ? 15 : 0) + (isAlbum ? 10 : 0) + (isCreative ? 15 : 0);
      const hitChance = Math.min(0.88, 0.15 + quality / 180);
      c.artsCareer.nextWorkBonus = false;
      c.artsCareer.works += 1;
      let plays = 0;
      let peakChart = null;
      if (Math.random() < hitChance) {
        // Hit: calculate streams
        const baseStreams = isAlbum ? Math.round((200000 + Math.random() * 5000000) * (1 + c.artsCareer.fame / 30) * label.fameMult * (isCreative ? 1.4 : 1)) : Math.round((50000 + Math.random() * 2000000) * (1 + c.artsCareer.fame / 40) * label.fameMult * (isCreative ? 1.4 : 1));
        plays = baseStreams;
        peakChart = Math.max(1, Math.round(100 - quality / 1.5 - Math.random() * 20));
        const royaltyPayout = Math.round(plays * 0.003 * label.royaltyRate);
        c.cash += royaltyPayout;
        c.artsCareer.totalStreams += plays;
        c.artsCareer.fame = clamp(c.artsCareer.fame + (isAlbum ? 10 : 5));
        c.artsCareer.streakHits += 1;
        applyEffects(c, {
          reputation: isAlbum ? 6 : 3
        });

        // Chart milestone
        if (peakChart === 1) {
          const m = `"${title}" hit #1 on the charts`;
          if (!c.artsCareer.milestones.includes(m)) c.artsCareer.milestones.push(m);
        }
        // General milestone
        const ms = ARTS_MILESTONES[c.specialization] || [];
        const earned = ms[Math.min(c.artsCareer.milestones.length, ms.length - 1)];
        if (earned && !c.artsCareer.milestones.find(m => m === earned)) c.artsCareer.milestones.push(earned);
        pushLog(c, {
          text: `🎵 "${title}" (${isAlbum ? "Album" : "Single"}) — Hit! ${(plays / 1000000).toFixed(1)}M streams, peaked at #${peakChart}. Royalties: ${money(royaltyPayout)}.`,
          tone: "money-up"
        });

        // Label offer check — if independent and fame high enough
        if (c.artsCareer.label === "indie" && c.artsCareer.fame >= 20 && Math.random() < 0.25) {
          setTimeout(() => setPendingDecision({
            type: "label_offer"
          }), 0);
        }
      } else {
        plays = Math.round(1000 + Math.random() * 20000);
        c.artsCareer.totalStreams += plays;
        c.artsCareer.streakHits = 0;
        c.artsCareer.fame = clamp(c.artsCareer.fame - 1);
        pushLog(c, {
          text: `🎵 "${title}" (${isAlbum ? "Album" : "Single"}) — didn't connect. ${(plays / 1000).toFixed(0)}K streams. Streak broken.`,
          tone: "money-down"
        });
      }
      c.artsCareer.discography = [...c.artsCareer.discography, {
        title,
        type,
        plays,
        peakChart,
        releaseAge: c.age
      }];
      return c;
    });
  }
