  function holdGalleryShow() {
    setChar(prev => {
      const c = structuredClone(prev);
      const cost = 15000;
      if (c.cash < cost) return prev;
      c.cash -= cost;
      const unsold = c.artsCareer.paintings.filter(p => !p.sold);
      if (unsold.length === 0) return prev;
      let totalSold = 0;
      const sellCount = Math.max(1, Math.floor(unsold.length * (0.4 + c.artsCareer.fame / 200)));
      const toSell = unsold.slice(0, sellCount);
      toSell.forEach(p => {
        const salePrice = Math.round(p.value * (1 + rnd(0.05, 0.3)));
        c.cash += salePrice;
        totalSold += salePrice;
        const idx = c.artsCareer.paintings.findIndex(x => x.title === p.title && !x.sold);
        if (idx >= 0) c.artsCareer.paintings[idx] = {
          ...c.artsCareer.paintings[idx],
          sold: true,
          value: salePrice
        };
      });
      c.artsCareer.fame = clamp(c.artsCareer.fame + 6);
      applyEffects(c, {
        reputation: 5,
        happiness: 4
      });

      // Milestone
      const ms = ARTS_MILESTONES[c.specialization] || [];
      const earned = ms[Math.min(c.artsCareer.milestones.length, ms.length - 1)];
      if (earned && !c.artsCareer.milestones.find(m => m === earned)) c.artsCareer.milestones.push(earned);
      pushLog(c, {
        text: `Gallery Show: sold ${toSell.length} paintings for ${money(totalSold)} total. Fame +6.`,
        tone: "money-up"
      });
      return c;
    });
  }

  /* ---------------- achievement checker ---------------- */

  function checkAchievements(c) {
    ACHIEVEMENTS.forEach(ach => {
      if (!(c.achievements || []).includes(ach.key) && ach.check(c)) {
        c.achievements = [...(c.achievements || []), ach.key];
      }
    });
  }

  /* ---------------- next-generation continue ---------------- */

  function continueAsChild() {
    const score = computeLegacyScore(char);
    const kid = char.rel.kids[0];

    // Kid's real age when parent died
    const kidAge = Math.max(0, char.age - (kid?.birthAge || 0));

    // Inheritance — scales with legacy score
    const inheritedCash = Math.round((char.cash * 0.6 + char.investments.stocks + char.investments.gold + char.investments.mf) * 0.5 + char.netWorthPeak * 0.05);

    // Stat bonus from parent's legacy (25pts → +3 to each stat)
    const statBonus = Math.floor(score / 25) * 3;

    // Family wealth based on parent's net worth
    const wealthTier = char.netWorthPeak >= 500000 ? "Affluent" : char.netWorthPeak >= 50000 ? "Middle Class" : "Working Class";

    // Auto-assign a trait if the kid is old enough (skips age-5 decision)
    const traitKeys = Object.keys(TRAITS);
    const autoTrait = kidAge >= 5 ? [traitKeys[Math.floor(Math.random() * traitKeys.length)]] : [];
    const traitFx = autoTrait[0] ? TRAITS[autoTrait[0]] : {};
    const newChar = {
      ...FRESH_CHAR(),
      name: kid?.name || "Heir",
      age: kidAge,
      cash: Math.max(0, inheritedCash),
      family: {
        wealth: wealthTier,
        type: "Nurturing"
      },
      traits: autoTrait,
      stats: {
        health: clamp(70 + statBonus + (traitFx.health || 0)),
        smarts: clamp(50 + statBonus + (traitFx.smarts || 0)),
        looks: clamp(50 + statBonus + (traitFx.looks || 0)),
        happiness: clamp(70 + statBonus + (traitFx.happiness || 0)),
        reputation: clamp(30 + Math.floor(statBonus / 2))
      },
      log: [{
        age: kidAge,
        text: `Your parent ${char.name} has passed away at ${char.age}, leaving a legacy score of ${score}/100. You are ${kidAge} years old and begin their next chapter.`,
        tone: "neutral"
      }, autoTrait[0] ? {
        age: kidAge,
        text: `Growing up under ${char.name}'s roof shaped you into someone ${TRAITS[autoTrait[0]].label.toLowerCase()}.`,
        tone: "trait"
      } : null].filter(Boolean)
    };

    // Reset all UI toggles
    setShowInvest(false);
    setShowStakes(false);
    setShowLifestyle(false);
    setLegacyData({
      parentName: char.name,
      legacyScore: score,
      kidName: kid?.name,
      inheritedCash
    });
    setChar(newChar);
    setPendingDecision(null);
    setScreen("play");

    // If kid is 18+, immediately prompt path selection so they can set their career
    if (kidAge >= 18) {
      setTimeout(() => setPendingDecision("path"), 50);
    }
  }

  /* ---------------- lifestyle: health, assets, philanthropy, PR ---------------- */

  function doHealthAction(key) {
    const act = HEALTH_ACTIONS.find(a => a.key === key);
    if (!act) return;
    setChar(prev => {
      const c = structuredClone(prev);
      if (c.cash < act.cost) return prev;
      c.cash -= act.cost;
      if (act.health) c.stats.health = clamp(c.stats.health + act.health);
      if (act.happiness) c.stats.happiness = clamp(c.stats.happiness + act.happiness);
      if (act.looks) c.stats.looks = clamp(c.stats.looks + act.looks);
      if (act.reducesDeathRisk) c.lifestyle.checkedUpThisYear = true;
      pushLog(c, {
        text: `Health: ${act.label}. −${money(act.cost)}${act.health ? ` · Health +${act.health}` : ""}${act.looks ? ` · Looks +${act.looks}` : ""}.`,
        tone: "neutral"
      });
      return c;
    });
  }
  function doPRAction(key) {
    const act = PR_ACTIONS.find(a => a.key === key);
    if (!act) return;
    setChar(prev => {
      const c = structuredClone(prev);
      if (c.cash < act.cost) return prev;
      c.cash -= act.cost;
      if (act.cashback) c.cash += act.cashback;
      let rep = act.rep || 0;
      let pop = act.pop || 0;

      // Speech: smarts-dependent
      if (act.repMult) {
        const bonus = Math.floor((c.stats.smarts - 40) / 10);
        rep = Math.max(0, 3 + bonus);
        pop = Math.max(0, 2 + Math.floor(bonus / 2));
        if (c.stats.smarts < 45) {
          rep = 0;
          pop = -3;
          pushLog(c, {
            text: `Public Speech: the delivery fell flat. Credibility dipped.`,
            tone: "money-down"
          });
        }
      }
      c.stats.reputation = clamp(c.stats.reputation + rep);
      c.politics.popularity = clamp(c.politics.popularity + pop);
      if (!act.repMult) pushLog(c, {
        text: `PR: ${act.label}. Rep +${rep}, Popularity +${pop}${act.cashback ? `, brand fee +${money(act.cashback)}` : ""}.`,
        tone: "money-up"
      });
      return c;
    });
  }
  function subscribeAgency(key) {
    setChar(prev => {
      const c = structuredClone(prev);
      const ag = AGENCIES.find(a => a.key === key);
      if (!ag) return prev;
      if ((c.lifestyle.agencies || []).find(a => a.key === key)) return prev;
      // First year cost upfront
      if (c.cash < ag.costPerYear) return prev;
      c.cash -= ag.costPerYear;
      c.lifestyle.agencies = [...(c.lifestyle.agencies || []), {
        key
      }];
      pushLog(c, {
        text: `Signed with ${ag.label}. Annual retainer: ${money(ag.costPerYear)}/yr.`,
        tone: "money-up"
      });
      return c;
    });
    setPendingDecision(null);
  }
  function cancelAgency(key) {
    setChar(prev => {
      const c = structuredClone(prev);
      const ag = AGENCIES.find(a => a.key === key);
      c.lifestyle.agencies = (c.lifestyle.agencies || []).filter(a => a.key !== key);
      pushLog(c, {
        text: `Ended contract with ${ag?.label || "agency"}.`,
        tone: "neutral"
      });
      return c;
    });
  }

  /* ---------------- end lifestyle ---------------- */

  function buyAsset(key) {
    const def = findAsset(key);
    if (!def) return;
    setChar(prev => {
      const c = structuredClone(prev);
      if (c.cash < def.price) return prev;
      if (c.lifestyle.assets.find(a => a.key === key)) return prev; // already owned
      c.cash -= def.price;
      c.stats.reputation = clamp(c.stats.reputation + def.rep);
      c.lifestyle.assets = [...c.lifestyle.assets, {
        key,
        label: def.label,
        sub: def.sub,
        purchasePrice: def.price,
        currentValue: def.price,
        repBoost: def.rep,
        happBoost: def.happBoost || 0
      }];
      pushLog(c, {
        text: `Acquired: ${def.label} (${def.sub}). ${money(def.price)}. Reputation +${def.rep}.`,
        tone: "money-up"
      });
      return c;
    });
    setPendingDecision(null);
  }
  function sellAsset(key) {
    setChar(prev => {
      const c = structuredClone(prev);
      const owned = c.lifestyle.assets.find(a => a.key === key);
      if (!owned) return prev;
      c.cash += owned.currentValue;
      c.lifestyle.assets = c.lifestyle.assets.filter(a => a.key !== key);
      pushLog(c, {
        text: `Sold ${owned.label} for ${money(owned.currentValue)}.`,
        tone: "money-up"
      });
      return c;
    });
  }
  function doPhilanthropy(key, customAmount) {
    const act = PHILANTHROPY_ACTIONS.find(a => a.key === key);
    if (!act) return;
    setChar(prev => {
      const c = structuredClone(prev);
      let cost = act.cost || 0;
      let rep = act.rep || 0;
      let pop = act.popularity || 0;
      if (act.variable) {
        const amt = Number(customAmount);
        if (!amt || amt < act.minAmt) return prev;
        cost = amt;
        // ₹1 lakh = 3 rep, 2 pop — scales logarithmically
        const lakhs = amt / 100000;
        rep = Math.round(3 * Math.log10(lakhs + 1) * 10);
        pop = Math.round(2 * Math.log10(lakhs + 1) * 10);
      }
      if (c.cash < cost) return prev;
      c.cash -= cost;
      c.stats.reputation = clamp(c.stats.reputation + rep);
      c.politics.popularity = clamp(c.politics.popularity + pop);
      if (act.geo && c.geo) c.geo.prestige = clamp(c.geo.prestige + act.geo);
      c.lifestyle.totalPhilanthropy += cost;
      c.lifestyle.philanthropy = [...c.lifestyle.philanthropy, {
        key,
        label: act.label,
        age: c.age
      }];
      pushLog(c, {
        text: `Philanthropy: ${act.label}. −${money(cost)}. Rep +${rep}, Popularity +${pop}.`,
        tone: "money-up"
      });
      return c;
    });
    setPendingDecision(null);
    setDonateInput("");
  }

  /* ---------------- age up ---------------- */

  function ageUp() {
    if (pendingDecision || !char.alive) return;
    setChar(prev => {
      const c = structuredClone(prev);
      c.age += 1;
      const stage = STAGE_BY_AGE(c.age);
      const entries = [];

      // passive drift
      if (c.age > 45) applyEffects(c, {
        health: -Math.round((c.age - 45) / 12) - 1
      });
      if (c.stats.happiness < 20) applyEffects(c, {
        health: -1
      });

      // investments
      const before = {
        ...c.investments
      };
      const dealBoost = (c.geo?.activeDeals || []).reduce((s, d) => s + (d.economyBoost || 0), 0);
      const econ = (c.politics.economyModifier || 0) + dealBoost;
      c.investments.stocks = Math.round(c.investments.stocks * (1 + rnd(-0.30, 0.35) + econ));
      c.investments.gold = Math.round(c.investments.gold * (1 + rnd(-0.05, 0.07) + econ * 0.2));
      c.investments.mf = Math.round(c.investments.mf * (1 + rnd(-0.12, 0.16) + econ * 0.5));
      if (before.stocks + before.gold + before.mf > 0) {
        const delta = c.investments.stocks - before.stocks + (c.investments.gold - before.gold) + (c.investments.mf - before.mf);
        entries.push({
          text: `Your portfolio ${delta >= 0 ? "gained" : "lost"} ${money(Math.abs(delta))} this year.`,
          tone: delta >= 0 ? "money-up" : "money-down"
        });
      }

      // path income / progression
      if (c.path === "college") {
        c.cash -= 1500;
        applyEffects(c, {
          smarts: 3
        });
        c.collegeYearsLeft -= 1;
        if (c.collegeYearsLeft <= 0) {
          c.path = "graduated";
          entries.push({
            text: "You graduated! Now to choose a field.",
            tone: "path"
          });
          setTimeout(() => setPendingDecision({
            type: "industry",
            fromCollege: true
          }), 0);
        } else {
          entries.push({
            text: `Another year of college behind you. ${c.collegeYearsLeft} to go.`,
            tone: "neutral"
          });
        }
      } else if (c.path === "job" && c.job) {
        const ind = INDUSTRIES[c.job.industry];
        const ladder = c.job.useGrad && ind.grad ? ind.grad : ind.direct;
        const company = getCompany(c.job.industry, c.job.company);
        const cultureH = company ? -Math.round((company.culture - 1) * 2) : 0;
        const cultureHap = company ? -Math.round((company.culture - 1) * 3) : 0;
        c.cash += c.job.salary;
        c.job.yearsAtCompany = (c.job.yearsAtCompany || 0) + 1;
        if (c.jobHopCooldown > 0) c.jobHopCooldown -= 1;
        if (ind.grantsReputation) applyEffects(c, {
          reputation: ind.grantsReputation
        });

        // passive prestige rep boost (small, but adds up over a career)
        if (company && company.prestige >= 70 && Math.random() < 0.35) {
          applyEffects(c, {
            reputation: 1
          });
        }
        // culture drift (grindy places burn you out)
        if (cultureH !== 0 || cultureHap !== 0) applyEffects(c, {
          health: cultureH,
          happiness: cultureHap
        });

        // equity payout for startups
        if (company?.equityChance && Math.random() < company.equityChance && c.job.yearsAtCompany >= 3) {
          const payout = Math.round(c.job.salary * (5 + Math.random() * 15));
          c.cash += payout;
          entries.push({
            text: `${company.label} had a liquidity event — your equity paid out ${money(payout)}.`,
            tone: "money-up"
          });
        }

        // promotion up the ladder — gated by tenure now
        const canPromote = c.job.ladderIdx < ladder.length - 1;
        const nextTier = canPromote ? ladder[c.job.ladderIdx + 1] : null;
        const score = driveScore(c, ind);
        const meetsNext = nextTier ? score >= nextTier.min : false;
        const tenureReady = c.job.yearsAtCompany >= 2;
        const promoChance = ind.promoBase + (score - (nextTier?.min || 0)) / 600;
        if (canPromote && meetsNext && tenureReady && Math.random() < promoChance) {
          const newSalary = Math.round(nextTier.salary * (company?.payMult || 1));
          c.job = {
            ...c.job,
            title: nextTier.title,
            salary: newSalary,
            ladderIdx: c.job.ladderIdx + 1
          };
          applyEffects(c, {
            reputation: 2
          });
          entries.push({
            text: `Promoted to ${c.job.title} at ${company?.label || "your firm"}. Now earning ${money(newSalary)}/yr.`,
            tone: "path"
          });
        } else {
          // within-role salary drift
          const swing = rnd(-ind.volatility * 0.4, ind.volatility * 0.6);
          const newSalary = Math.max(500, Math.round(c.job.salary * (1 + swing)));
          const drift = newSalary - c.job.salary;
          c.job = {
            ...c.job,
            salary: newSalary
          };
          if (Math.abs(drift) > c.job.salary * 0.05) {
            entries.push({
              text: drift > 0 ? `A ${ind.label.toLowerCase()} boom lifted your pay by ${money(drift)}.` : `Rough year in ${ind.label.toLowerCase()} — pay slipped ${money(Math.abs(drift))}.`,
              tone: drift > 0 ? "money-up" : "money-down"
            });
          }
        }

        // firing (your fault, low reputation) — separate from macro layoffs
        const fireChance = c.stats.reputation < 30 ? 0.05 + (30 - c.stats.reputation) / 300 : 0;
        if (Math.random() < fireChance) {
          applyEffects(c, {
            reputation: -8,
            happiness: -10
          });
          c.job = null;
          c.jobHopCooldown = 0;
          entries.push({
            text: `${company?.label || "Your employer"} let you go over performance. You're between jobs.`,
            tone: "money-down"
          });
        } else if (c.job && Math.random() < ind.layoffBase * (company?.layoffMod || 1) - c.stats.reputation / 800) {
          // macro layoff — bumps down a rung but you stay employed
          const idx = Math.max(0, c.job.ladderIdx - 1);
          const dropped = ladder[idx];
          c.job = {
            ...c.job,
            title: dropped.title,
            salary: Math.round(dropped.salary * (company?.payMult || 1) * 0.85),
            ladderIdx: idx
          };
          applyEffects(c, {
            happiness: -6
          });
          entries.push({
            text: `${company?.label || "The firm"} restructured — you took a demotion to ${c.job.title}.`,
            tone: "money-down"
          });
        }

        // headhunter (passive job offer)
        if (c.job && c.job.yearsAtCompany >= 3 && c.jobHopCooldown === 0 && Math.random() < 0.06 + c.stats.reputation / 800) {
          const eligible = eligibleCompanies(c, c.job.industry, driveScore(c, ind)).filter(co => co.key !== c.job.company);
          if (eligible.length) {
            const suitor = eligible[Math.floor(Math.random() * eligible.length)];
            setTimeout(() => setPendingDecision({
              type: "headhunter",
              company: suitor
            }), 0);
          }
        }
      } else if (c.path === "job" && !c.job) {
        // unemployed — auto job search after a beat
        if (Math.random() < 0.5) {
          const score = driveScore(c, INDUSTRIES.trade);
          const co = pickStartingCompany(c, "trade", score);
          c.job = jobForIndustry(c, "trade", false, co);
          entries.push({
            text: `You took what work you could find — hired as a ${c.job.title} at ${co.label}.`,
            tone: "path"
          });
        } else {
          entries.push({
            text: "Another year between jobs — savings dwindling.",
            tone: "money-down"
          });
        }
      } else if (c.path === "business") {
        const type = BUSINESS_TYPES[c.specialization];
        if (type) {
          const econBoost = type.econSensitive ? c.politics.economyModifier || 0 : 0;
          let income = c.businessLevel * type.incomeBase + (type.incomeRepMult || 0) * c.stats.reputation + (type.incomeSmartsMult || 0) * c.stats.smarts;
          income = Math.round(income * (1 + econBoost));
          c.cash += income;
          const growthChance = type.growthChance + (c.stats.smarts + c.stats.reputation) / 500;
          const failureChance = type.failureChance * (c.businessLevel <= 2 ? 1.3 : 0.8);
          if (Math.random() < growthChance) {
            c.businessLevel += 1;
            entries.push({
              text: `Your ${type.label.toLowerCase()} expanded to level ${c.businessLevel}. Earned ${money(income)}.`,
              tone: "path"
            });
          } else if (Math.random() < failureChance && c.businessLevel > 1) {
            c.businessLevel -= 1;
            entries.push({
              text: `A rough year forced your ${type.label.toLowerCase()} to scale back.`,
              tone: "money-down"
            });
          } else if (Math.random() < failureChance * 0.5 && c.businessLevel === 1) {
            c.path = "job";
            c.specialization = null;
            c.businessLevel = 0;
            entries.push({
              text: `Your ${type.label.toLowerCase()} went under. You'll need to find work.`,
              tone: "money-down"
            });
            setTimeout(() => setPendingDecision({
              type: "industry",
              fromCollege: false
            }), 0);
          } else {
            entries.push({
              text: `Your ${type.label.toLowerCase()} kept ticking over. Earned ${money(income)}.`,
              tone: "money-up"
            });
          }

          // signature moment
          const sig = type.signature;
          if (c.businessLevel >= sig.minLevel && Math.random() < sig.chance) {
            const payout = Math.round(income * sig.payoutMult);
            c.cash += payout;
            applyEffects(c, {
              reputation: sig.rep
            });
            entries.push({
              text: `${sig.text()} Windfall: ${money(payout)}.`,
              tone: "money-up"
            });
          }
        }
      } else if (c.path === "sports") {
        const spec = SPORTS[c.specialization];
        if (spec) {
          // Career rating decays slightly each year (age, maintenance required)
          const ageDrop = c.age > spec.retireAge - 6 ? 2 : 0;
          c.sportsCareer.rating = clamp(c.sportsCareer.rating - ageDrop);

          // Income: base + stats, multiplied by career rating (0.3x to 1.5x)
          const ratingMult = 0.30 + c.sportsCareer.rating / 70;
          const baseIncome = spec.base + c.stats.health * spec.hMult / 10 + c.stats.looks * spec.lMult / 10 + c.stats.reputation * spec.rMult / 10;
          const finalIncome = Math.round(baseIncome * ratingMult);
          c.cash += finalIncome;

          // Sponsorship passive income
          let sponsorTotal = 0;
          c.sportsCareer.sponsorships.forEach(sub => {
            const sp = SPORTS_SPONSORS.find(s => s.key === sub.key);
            if (sp) {
              c.cash += sp.income;
              sponsorTotal += sp.income;
            }
          });

          // Injury
          if (Math.random() < spec.injuryRate) {
            const hit = Math.round(6 + Math.random() * 10);
            applyEffects(c, {
              health: -hit
            });
            c.sportsCareer.rating = clamp(c.sportsCareer.rating - 5);
            entries.push({
              text: `Serious injury this season. Health −${hit}, Rating −5.`,
              tone: "money-down"
            });
          }

          // Signature moment
          if (Math.random() < spec.signature.chance) {
            const payout = Math.round(finalIncome * spec.signature.payoutMult);
            c.cash += payout;
            applyEffects(c, {
              reputation: spec.signature.rep
            });
            c.sportsCareer.rating = clamp(c.sportsCareer.rating + 4);
            entries.push({
              text: `${spec.signature.text(c)} Bonus: ${money(payout)}.`,
              tone: "money-up"
            });
          }
          const earnedNote = sponsorTotal > 0 ? ` + ${money(sponsorTotal)} sponsors` : "";
          entries.push({
            text: `${spec.label} season: ${money(finalIncome)}${earnedNote}. Rating: ${c.sportsCareer.rating}.`,
            tone: "money-up"
          });

          // Retirement
          if (c.age > spec.retireAge - 4 && Math.random() < 0.15 + Math.max(0, c.age - spec.retireAge) * 0.12) {
            c.path = "job";
            c.job = jobForIndustry(c, "media", false);
            const co = getCompany("media", c.job.company);
            c.cash += finalIncome * 2;
            entries.push({
              text: `You retired from ${spec.label.toLowerCase()} with ${c.sportsCareer.tournamentWins} tournament wins and ${c.sportsCareer.trophies.length} trophies. Now at ${co.label} as ${c.job.title}.`,
              tone: "path"
            });
          }
        }
      } else if (c.path === "arts") {
        const spec = ARTS[c.specialization];
        if (spec) {
          const labelDef = ARTS_LABELS.find(l => l.key === c.artsCareer.label) || ARTS_LABELS[0];

          // Fame passive decay
          if (c.artsCareer.fame > 0 && Math.random() < 0.3) {
            c.artsCareer.fame = clamp(c.artsCareer.fame - 1);
          }

          // Creative trait: additional fame maintenance
          if (c.traits.includes("creative") && c.artsCareer.fame > 0) {
            c.artsCareer.fame = clamp(c.artsCareer.fame + 1);
          }

          // Base passive income: scales with fame + label multiplier
          const fameMult = 0.2 + c.artsCareer.fame / 80;
          const passiveBase = spec.base + c.stats.reputation * spec.rMult / 10 + (spec.sMult || 0) * c.stats.smarts / 10;
          const streakBonus = 1 + c.artsCareer.streakHits * 0.1;
          const finalIncome = Math.round(passiveBase * fameMult * labelDef.fameMult * labelDef.royaltyRate * streakBonus);
          c.cash += finalIncome;
          if (spec.sMult) applyEffects(c, {
            smarts: 1
          });

          // Musician: streaming royalties from back catalogue
          if (c.specialization === "musician") {
            const isCreative = c.traits.includes("creative");
            // Each work gains annual plays based on fame
            let newStreams = 0;
            c.artsCareer.discography = (c.artsCareer.discography || []).map(track => {
              const decay = track.type === "album" ? 0.85 : 0.70; // albums last longer
              const fanBase = Math.round(track.plays * (1 - decay) * (1 + c.artsCareer.fame / 100) * (isCreative ? 1.2 : 1));
              newStreams += fanBase;
              return {
                ...track,
                plays: track.plays + fanBase
              };
            });
            c.artsCareer.totalStreams = (c.artsCareer.totalStreams || 0) + newStreams;
            const streamingRoyalties = Math.round(newStreams * 0.003 * labelDef.royaltyRate);
            if (streamingRoyalties > 0) {
              c.cash += streamingRoyalties;
              if (streamingRoyalties > 5000) entries.push({
                text: `Streaming royalties from catalogue: ${money(streamingRoyalties)} (${(newStreams / 1000).toFixed(0)}K plays).`,
                tone: "money-up"
              });
            }
          }

          // Painter: paintings appreciate, auction events
          if (c.specialization === "painter") {
            const unsoldCount = (c.artsCareer.paintings || []).filter(p => !p.sold).length;
            c.artsCareer.paintings = (c.artsCareer.paintings || []).map(p => {
              if (p.sold) return p;
              const appRate = 0.10 + c.artsCareer.fame / 200 + rnd(-0.02, 0.05);
              return {
                ...p,
                value: Math.round(p.value * (1 + appRate))
              };
            });
            const portfolioVal = c.artsCareer.paintings.filter(p => !p.sold).reduce((s, p) => s + p.value, 0);
            // Auction event: random high-value sale
            if (unsoldCount > 0 && Math.random() < 0.08 + c.artsCareer.fame / 500) {
              const topPainting = [...c.artsCareer.paintings].filter(p => !p.sold).sort((a, b) => b.value - a.value)[0];
              if (topPainting) {
                const auctionPrice = Math.round(topPainting.value * (3 + Math.random() * 3));
                c.cash += auctionPrice;
                const idx = c.artsCareer.paintings.findIndex(p => p.title === topPainting.title && !p.sold);
                if (idx >= 0) c.artsCareer.paintings[idx] = {
                  ...c.artsCareer.paintings[idx],
                  sold: true,
                  value: auctionPrice
                };
                applyEffects(c, {
                  reputation: 8
                });
                entries.push({
                  text: `🎨 Auction: "${topPainting.title}" sold for ${money(auctionPrice)} (${Math.round(auctionPrice / topPainting.value)}× valuation).`,
                  tone: "money-up"
                });
              }
            }
            if (portfolioVal > 0 && unsoldCount > 0) entries.push({
              text: `${spec.label}: portfolio of ${unsoldCount} unsold works valued at ${money(portfolioVal)}.`,
              tone: "money-up"
            });
          }
          entries.push({
            text: `${spec.label} royalties: ${money(finalIncome)} (Fame ${c.artsCareer.fame} · ${labelDef.label}${c.artsCareer.streakHits > 1 ? ` · 🔥${c.artsCareer.streakHits}-hit` : ""}).`,
            tone: "money-up"
          });
        }
      }

      // Charismatic trait: passive popularity maintenance
      if (c.traits.includes("charismatic") && c.age >= 18) {
        c.politics.popularity = clamp(c.politics.popularity + 1);
        c.stats.reputation = clamp(c.stats.reputation + 1);
      }
      // Cunning trait: passive business/underworld income boost (handled in multipliers)
      // — adds 1 smarts per year as a sustained sharpness
      if (c.traits.includes("cunning") && c.age >= 18 && c.stats.smarts < 90) {
        c.stats.smarts = clamp(c.stats.smarts + 1);
      }

      // politics: term countdown, scandal, impeachment
      if (c.politics.office) {
        const tier = POLITICAL_TIERS.find(t => t.key === c.politics.office);
        c.politics.termYearsLeft -= 1;
        c.politics.approval = clamp(c.politics.approval + rnd(-3, 3));

        // popularity slowly rises while in office if approval is good
        if (c.politics.approval > 55) c.politics.popularity = clamp(c.politics.popularity + 1);else if (c.politics.approval < 35) c.politics.popularity = clamp(c.politics.popularity - 2);
        const scandalChance = 0.03 + (c.stats.reputation < 40 ? 0.05 : 0) + (c.traits.includes("notorious") ? 0.05 : 0) + (c.party.affiliation ? -0.02 : 0.02);
        if (Math.random() < scandalChance) {
          // Crisis PR shield reduces scandal damage
          const crisisShield = (c.lifestyle.agencies || []).reduce((s, sub) => {
            const ag = AGENCIES.find(a => a.key === sub.key);
            return s + (ag?.crisisShield || 0);
          }, 0);
          const shieldMult = Math.max(0.1, 1 - crisisShield);
          const approvalHit = Math.round(15 * shieldMult);
          const repHit = Math.round(8 * shieldMult);
          const popHit = Math.round(6 * shieldMult);
          c.politics.approval = clamp(c.politics.approval - approvalHit);
          applyEffects(c, {
            reputation: -repHit
          });
          c.politics.popularity = clamp(c.politics.popularity - popHit);
          if (c.party.affiliation) c.party.standing = clamp(c.party.standing - 6, -100, 100);
          const shieldNote = crisisShield > 0 ? ` (PR shield softened the blow by ${Math.round(crisisShield * 100)}%)` : "";
          entries.push({
            text: `A scandal broke out during your time in office${shieldNote}.`,
            tone: "politics"
          });
        }
        if (c.politics.approval < 20 && Math.random() < 0.25) {
          entries.push({
            text: `Public outrage forced you out as ${tier.label}.`,
            tone: "politics"
          });
          c.politics.office = null;
          c.politics.termYearsLeft = 0;
          c.politics.electionCooldown = 2;
          applyEffects(c, {
            reputation: -10
          });
          c.politics.popularity = clamp(c.politics.popularity - 12);
        } else if (c.politics.termYearsLeft <= 0) {
          if (tier.termLimit && c.politics.termsServed[tier.key] >= tier.termLimit) {
            entries.push({
              text: `Term-limited, you stepped down as ${tier.label}.`,
              tone: "politics"
            });
            c.politics.office = null;
          } else {
            setTimeout(() => runForOffice(tier.key, true), 0);
          }
        }

        // Party rank promotion in office: sustained good standing bumps you up (up to Cabinet Minister)
        if (c.party.affiliation && c.party.rankIdx < 2 && c.party.standing >= 60 && c.politics.termsServed.mayor + c.politics.termsServed.governor >= 1) {
          c.party.rankIdx = 2;
          const party = POLITICAL_PARTIES[c.party.affiliation];
          entries.push({
            text: `The ${party.short} elevated you to ${PARTY_RANKS[2]}.`,
            tone: "politics"
          });
        }
      } else {
        // Out of office: popularity decays
        if (c.politics.popularity > 15) c.politics.popularity = clamp(c.politics.popularity - 1);
      }

      // Party recruitment offer: popular first-time officeholder with no party
      if (!c.party.affiliation && c.politics.office && c.politics.popularity >= 40 && c.politics.partyOfferCooldown === 0 && Math.random() < 0.35) {
        // Match a party to your recent voting record
        const recent = (c.politics.lawsPassed || []).slice(-4);
        const scored = Object.values(POLITICAL_PARTIES).map(p => {
          const score = recent.reduce((s, k) => s + (p.likes.includes(k) ? 2 : p.hates.includes(k) ? -2 : 0), 0) + p.baseSupport / 10;
          return {
            p,
            score
          };
        }).sort((a, b) => b.score - a.score);
        const suitor = scored[0].p;
        setTimeout(() => setPendingDecision({
          type: "party_offer",
          partyKey: suitor.key
        }), 0);
      }
      if (c.politics.partyOfferCooldown > 0) c.politics.partyOfferCooldown -= 1;

      // Leadership contest auto-trigger: rank Minister+, high standing, high popularity, small chance
      if (c.party.affiliation && c.party.rankIdx >= 2 && c.party.rankIdx < 3 && c.party.standing >= 55 && c.politics.popularity >= 55 && c.party.leadershipChallengeCooldown === 0 && Math.random() < 0.07) {
        const party = POLITICAL_PARTIES[c.party.affiliation];
        entries.push({
          text: `The ${party.short} leader signalled they may step down. Your name is being floated.`,
          tone: "politics"
        });
      }
      if (c.party.leadershipChallengeCooldown > 0) c.party.leadershipChallengeCooldown -= 1;
      if (c.politics.electionCooldown > 0) c.politics.electionCooldown -= 1;
      if (c.politics.economyYearsLeft > 0) {
        c.politics.economyYearsLeft -= 1;
        if (c.politics.economyYearsLeft === 0) c.politics.economyModifier = 0;
      }

      // geopolitics tick — Cabinet Minister+ sees world events; PM acts
      if (c.politics.office === "national" || c.politics.office === "governor" || c.party.affiliation && c.party.rankIdx >= 2) {
        // reset annual action flag
        c.geo.actionUsedThisYear = false;
        c.geo.crisisThisYear = false;

        // tick active trade deals
        const expiredDeals = [];
        c.geo.activeDeals = c.geo.activeDeals.map(d => {
          if (d.economyBoost && d.yearsLeft > 0) c.politics.economyModifier = Math.max(c.politics.economyModifier || 0, d.economyBoost);
          const updated = {
            ...d,
            yearsLeft: d.yearsLeft - 1
          };
          if (updated.yearsLeft <= 0) expiredDeals.push(d);
          return updated;
        }).filter(d => d.yearsLeft > 0);
        if (expiredDeals.length) entries.push({
          text: `Trade deal with ${WORLD_POWERS[expiredDeals[0].power]?.label} has expired.`,
          tone: "politics"
        });

        // passive relations drift — allies grow closer, rivals drift away
        Object.keys(c.geo.relations).forEach(pk => {
          const hasDeal = c.geo.activeDeals.some(d => d.power === pk && d.type === "trade_deal");
          const hasDefense = c.geo.activeDeals.some(d => d.power === pk && d.type === "defense_pact");
          const drift = (hasDeal ? 1 : 0) + (hasDefense ? 1 : 0) - (c.geo.warsWith.find(w => w.power === pk) ? 4 : 0);
          c.geo.relations[pk] = clamp(c.geo.relations[pk] + drift, -100, 100);
        });

        // war tick — costs cash, health (happiness), may resolve
        if (c.geo.warsWith.length > 0 && c.politics.office === "national") {
          c.geo.warsWith = c.geo.warsWith.map(w => ({
            ...w,
            yearsIn: w.yearsIn + 1
          }));
          const warCost = c.geo.warsWith.length * 6000;
          c.cash -= warCost;
          c.politics.approval = clamp(c.politics.approval - 5);
          c.politics.popularity = clamp(c.politics.popularity - 3);
          applyEffects(c, {
            happiness: -3
          });
          entries.push({
            text: `War effort drains ${money(warCost)} from the treasury. Morale is fraying.`,
            tone: "money-down"
          });
          // auto-resolution if war drags past 3 years
          c.geo.warsWith.forEach(w => {
            if (w.yearsIn >= 3 && Math.random() < 0.45) {
              setTimeout(() => setPendingDecision({
                type: "war_resolve",
                powerKey: w.power
              }), 0);
            }
          });
        }

        // prestige passive decay if not in high office
        if (c.politics.office !== "national" && c.geo.prestige > 0) {
          c.geo.prestige = clamp(c.geo.prestige - 1);
        }

        // prestige achievements
        PRESTIGE_ACHIEVEMENTS.forEach(ach => {
          if (!c.geo.achievements.includes(ach.key) && c.geo.prestige >= ach.threshold) {
            if (ach.peacePolicyReq && (c.geo.peacePolicies || 0) < 3) return;
            c.geo.achievements.push(ach.key);
            c.cash += ach.cash;
            applyEffects(c, {
              reputation: ach.rep
            });
            c.politics.popularity = clamp(c.politics.popularity + 8);
            entries.push({
              text: `Achievement unlocked: ${ach.label}. ${ach.desc}`,
              tone: "money-up"
            });
          }
        });

        // international crisis (PM only, ~30% chance per year, one per year)
        if (c.politics.office === "national" && !c.geo.crisisThisYear && Math.random() < 0.30) {
          const crisis = pick(CRISES);
          c.geo.crisisThisYear = true;
          setTimeout(() => setPendingDecision({
            type: "crisis",
            crisisKey: crisis.key
          }), 0);
        }
      }

      // ── relationships tick ──────────────────────────────────────────
      if (c.rel.meetCooldown > 0) c.rel.meetCooldown -= 1;
      if (c.rel.stage === "dating" && c.rel.partner) {
        c.rel.partner.yearsTogether = (c.rel.partner.yearsTogether || 0) + 1;
        // prompt commit/break after 1 year
        if (c.rel.partner.yearsTogether === 1) {
          setTimeout(() => setPendingDecision({
            type: "rel_commit"
          }), 0);
        }
      }
      if (c.rel.stage === "engaged") {
        // auto-marry after 1 year
        setTimeout(() => setPendingDecision({
          type: "rel_marry"
        }), 0);
      }
      if (c.rel.stage === "married" && c.rel.partner) {
        const pers = PARTNER_PERSONALITIES[c.rel.partner.personality];
        c.rel.partner.yearsTogether = (c.rel.partner.yearsTogether || 0) + 1;
        c.cash += c.rel.partner.income;

        // compatibility drift (neglected careers erode compat)
        const careerDemand = c.politics.office === "national" || c.path === "business" ? -2 : 0;
        const partnerDrift = Math.round(rnd(-1, 1)) + careerDemand;
        c.rel.partner.compatibility = clamp(c.rel.partner.compatibility + partnerDrift);

        // annual happiness effect
        if (c.rel.partner.compatibility >= 55) {
          applyEffects(c, {
            happiness: pers.happBoostIfCompatHigh,
            health: 1
          });
        } else if (c.rel.partner.compatibility < 35) {
          applyEffects(c, {
            happiness: pers.happDrainIfCompatLow
          });
        }

        // kid cost drain
        const youngKids = c.rel.kids.filter(k => c.age - k.birthAge < 18);
        if (youngKids.length > 0) {
          c.cash -= youngKids.length * 800;
          if (c.stats.happiness > 55) applyEffects(c, {
            happiness: 2
          });else applyEffects(c, {
            happiness: -1
          });
        }

        // kids grown up
        c.rel.kids.forEach(k => {
          if (c.age - k.birthAge === 18) {
            c.cash += 2000;
            applyEffects(c, {
              happiness: 6
            });
            entries.push({
              text: `${k.name} turned 18 and left home. Proud and a little empty.`,
              tone: "neutral"
            });
          }
        });

        // divorce trigger: compat < 30 AND happiness < 35 for 2+ years
        if (c.rel.partner.compatibility < 30 && c.stats.happiness < 35) {
          c.rel.lowHappYears = (c.rel.lowHappYears || 0) + 1;
          if (c.rel.lowHappYears >= 2 && Math.random() < 0.35) {
            setTimeout(() => setPendingDecision({
              type: "rel_divorce"
            }), 0);
          }
        } else {
          c.rel.lowHappYears = 0;
        }

        // kid decision prompt (15% chance per year if married and < 3 kids and age < 42)
        if (c.age < 42 && c.rel.kids.length < 3 && Math.random() < 0.15) {
          setTimeout(() => setPendingDecision({
            type: "rel_kid"
          }), 0);
        }

        // partner death (rare, age > 55)
        if (c.age > 55 && Math.random() < 0.012) {
          applyEffects(c, {
            happiness: -20,
            health: -5
          });
          c.rel.stage = "widowed";
          const pName = c.rel.partner.name;
          c.rel.partner = null;
          entries.push({
            text: `${pName} passed away. The world got smaller.`,
            tone: "death"
          });
        }
      }

      // random encounter (18-38, single, not in cooldown)
      if (c.age >= 18 && c.age <= 50 && c.rel.stage === "single" && c.rel.meetCooldown === 0 && Math.random() < 0.20) {
        const partner = genPartner(c);
        c.rel.partner = partner;
        c.rel.stage = "dating";
        c.rel.meetCooldown = 3;
        applyEffects(c, {
          happiness: 4
        });
        entries.push({
          text: `You met ${partner.name}. Early days, but there's something there.`,
          tone: "neutral"
        });
      }

      // parents' inheritance (char age ~55-65)
      if (!c.rel.inheritanceReceived && c.age >= 55 && Math.random() < 0.12) {
        c.rel.inheritanceReceived = true;
        const tier = c.family?.wealth;
        const base = tier === "Affluent" ? 120000 : tier === "Middle Class" ? 35000 : 8000;
        const inhAmt = Math.round(base * (0.8 + Math.random() * 0.5));
        c.cash += inhAmt;
        entries.push({
          text: `Your parents passed. You inherited ${money(inhAmt)}.`,
          tone: "money-up"
        });
      }

      // addiction: track and trigger
      if (c.stats.happiness < 25) {
        c.rel.lowHappYears = (c.rel.lowHappYears || 0) + 1;
        if (c.rel.lowHappYears >= 3 && !c.rel.addicted && Math.random() < 0.30) {
          c.rel.addicted = Math.random() < 0.5 ? "substances" : "gambling";
          entries.push({
            text: `The low years caught up with you. You developed a ${c.rel.addicted} habit.`,
            tone: "money-down"
          });
        }
      } else {
        if (c.rel.stage !== "married") c.rel.lowHappYears = Math.max(0, (c.rel.lowHappYears || 0) - 1);
      }
      if (c.rel.addicted) {
        applyEffects(c, {
          smarts: -3,
          health: -4,
          reputation: -4
        });
        c.cash -= 2000;
        if (c.rel.rehabYears > 0) {
          c.rel.rehabYears -= 1;
          if (c.rel.rehabYears === 0) {
            c.rel.addicted = null;
            applyEffects(c, {
              happiness: 10,
              reputation: 3
            });
            entries.push({
              text: "You completed rehab. The fog is lifting.",
              tone: "neutral"
            });
          }
        } else {
          setTimeout(() => setPendingDecision({
            type: "addiction"
          }), 0);
        }
      }

      // burnout tracker
      const company = c.job ? getCompany(c.job.industry, c.job.company) : null;
      if (company && company.culture >= 1.2) {
        c.rel.burnoutYears = (c.rel.burnoutYears || 0) + 1;
      } else {
        c.rel.burnoutYears = Math.max(0, (c.rel.burnoutYears || 0) - 1);
      }

      // sabbatical — skip income this year if on sabbatical
      if (c.rel.onSabbatical) {
        c.rel.onSabbatical = false;
        entries.push({
          text: "You returned from sabbatical, steadier than when you left.",
          tone: "neutral"
        });
      }

      // ── big life events (25% chance per year, Adult+, min 3 yrs since last) ──
      if (stage !== "Infant" && stage !== "Child" && stage !== "Teen" && c.age - (c.rel.lastBigEvent || -5) >= 3 && Math.random() < 0.25) {
        const eligible = BIG_EVENTS.filter(ev => {
          if (ev.key === "burnout" && c.rel.burnoutYears < 2) return false;
          if (ev.key === "viral_moment" && !(c.path === "arts" || c.path === "job" && c.job?.industry === "media" || c.politics.office)) return false;
          if (ev.key === "fraud_victim" && c.cash < 3000 && !Object.values(c.investments).some(v => v > 0)) return false;
          return ev.condition ? ev.condition(c) : true;
        });
        if (eligible.length) {
          const ev = pick(eligible);
          setTimeout(() => setPendingDecision({
            type: "big_event",
            eventKey: ev.key
          }), 0);
        }
      }

      // ── underworld tick ────────────────────────────────────────────────
      if (c.underworld.active || c.underworld.prisonYearsLeft > 0 || c.underworld.heat > 10) {
        c.underworld.opUsedThisYear = false;

        // prison countdown
        if (c.underworld.prisonYearsLeft > 0) {
          c.underworld.prisonYearsLeft -= 1;
          c.underworld.heat = clamp(c.underworld.heat - 8);
          applyEffects(c, {
            happiness: -10,
            reputation: -3
          });
          entries.push({
            text: `Year ${c.underworld.beenArrested ? "inside" : "in prison"}. The walls close in. ${c.underworld.prisonYearsLeft} to go.`,
            tone: "money-down"
          });
          if (c.underworld.prisonYearsLeft === 0) {
            entries.push({
              text: "You walked out. Different man. The city feels foreign.",
              tone: "neutral"
            });
          }
          // skip everything else while in prison
        } else if (c.underworld.active) {
          c.underworld.yearsActive += 1;

          // passive crew income — scales heavily with crew size + rank + empire
          const rankDef = CRIME_RANKS[c.underworld.rank] || CRIME_RANKS[0];
          const crewIncome = c.underworld.crewSize * 500;
          const rankIncome = rankDef.incomeBase;
          const empTier = EMPIRE_TIERS[c.underworld.empireLevel || 0];
          const empireIncome = empTier ? empTier.passiveIncome : 0;
          const notorietyMultiplier = 1 + c.underworld.notoriety / 200;
          const passiveTotal = Math.round((crewIncome + rankIncome + empireIncome) * notorietyMultiplier);
          c.underworld.dirtyMoney += passiveTotal;

          // empire auto-launder via fronts (each front = 10k clean/yr)
          if (empTier && empTier.fronts > 0) {
            const hasRealEstate = (c.businessStakes || []).some(s => s.type === "realestate");
            const rate = 0.70 + (empTier.launderBonus || 0) + (hasRealEstate ? 0.08 : 0);
            const autoLaunderCap = empTier.fronts * 80000;
            const laundering = Math.min(c.underworld.dirtyMoney * 0.3, autoLaunderCap);
            if (laundering > 0) {
              c.underworld.dirtyMoney -= laundering;
              c.cash += Math.round(laundering * rate);
            }
          }

          // notoriety — passive drift based on activity
          const notorietyGain = Math.floor(c.underworld.crewSize / 50) + Math.floor(c.underworld.rank / 2);
          c.underworld.notoriety = clamp(c.underworld.notoriety + notorietyGain);

          // heat natural decay
          if (c.underworld.heat > 5) c.underworld.heat = clamp(c.underworld.heat - 2);
          // PM heat suppression
          if (c.politics.office === "national") c.underworld.heat = clamp(c.underworld.heat - 6);

          // war with family: hit attempts + crew loss
          c.underworld.atWar.forEach(fk => {
            if (Math.random() < 0.40) {
              const crewLost = Math.round(2 + Math.random() * 6);
              c.underworld.crewSize = Math.max(1, c.underworld.crewSize - crewLost);
              c.underworld.notoriety = clamp(c.underworld.notoriety - 2);
              applyEffects(c, {
                health: -5,
                happiness: -4
              });
              entries.push({
                text: `War with ${CRIME_FAMILIES[fk].label}: ${crewLost} soldiers down.`,
                tone: "money-down"
              });
            }
            if (c.underworld.rank >= 4 && Math.random() < 0.12) {
              applyEffects(c, {
                health: -12
              });
              entries.push({
                text: `${CRIME_FAMILIES[fk].label} sent someone for you. You survived — barely.`,
                tone: "death"
              });
            }
          });

          // rival aggression at Capo+
          if (c.underworld.rank >= 4) {
            Object.entries(c.underworld.relations).forEach(([fk, rel]) => {
              if (rel < -30 && !c.underworld.atWar.includes(fk) && Math.random() < 0.15) {
                c.underworld.heat = clamp(c.underworld.heat + 8);
                applyEffects(c, {
                  health: -4
                });
                entries.push({
