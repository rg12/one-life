function eligibleCompanies(c, industryKey, score) {
  const list = COMPANIES[industryKey] || [];
  return list.filter(co => co.prestige <= score + 15);
}
function pickStartingCompany(c, industryKey, score) {
  const eligible = eligibleCompanies(c, industryKey, score);
  if (eligible.length === 0) return COMPANIES[industryKey][COMPANIES[industryKey].length - 1];
  const weighted = eligible.map(co => ({
    co,
    w: Math.max(1, 100 - Math.abs(score - co.prestige))
  }));
  const total = weighted.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  for (const {
    co,
    w
  } of weighted) {
    r -= w;
    if (r <= 0) return co;
  }
  return eligible[0];
}
function jobForIndustry(c, industryKey, useGrad, companyOverride) {
  const ind = INDUSTRIES[industryKey];
  const ladder = useGrad && ind.grad ? ind.grad : ind.direct;
  if (!ladder) return null;
  const score = driveScore(c, ind);
  const chosen = ladder[0];
  const ladderIdx = 0;
  const company = companyOverride || pickStartingCompany(c, industryKey, score);
  const country = getCountry(c.country);
  const statVariance = 0.82 + Math.min(1, Math.max(0, score / 100)) * 0.36;
  return {
    industry: industryKey,
    company: company.key,
    title: chosen.title,
    salary: Math.round(chosen.salary * company.payMult * country.payMult * statVariance),
    ladderIdx,
    useGrad,
    yearsAtCompany: 0
  };
}
function getCompany(industryKey, companyKey) {
  return (COMPANIES[industryKey] || []).find(c => c.key === companyKey);
}

function getCountryNames(countryKey) {
  const pool = NAMES_BY_COUNTRY[countryKey] || NAMES_BY_COUNTRY.india;
  return {
    male: pool.male,
    female: pool.female,
    nb: [...pool.male.slice(0, 5), ...pool.female.slice(0, 5)]
  };
}
function genPartner(c) {
  const persList = Object.values(PARTNER_PERSONALITIES);
  const pers = persList[Math.floor(Math.random() * persList.length)];
  const names = getCountryNames(c.country);
  let namePool;
  let partnerGender;
  if (c.attraction === "men") {
    namePool = names.male;
    partnerGender = "male";
  } else if (c.attraction === "women") {
    namePool = names.female;
    partnerGender = "female";
  } else {
    const r = Math.random();
    if (r < 0.45) {
      namePool = names.female;
      partnerGender = "female";
    } else if (r < 0.90) {
      namePool = names.male;
      partnerGender = "male";
    } else {
      namePool = names.nb;
      partnerGender = "nb";
    }
  }
  const name = namePool[Math.floor(Math.random() * namePool.length)];
  const traitBonus = Object.entries(pers.traitBonus).reduce((s, [k, v]) => s + (c.traits.includes(k) ? v : 0), 0);
  const pathBonus = pers.pathBonus[c.job?.industry || c.path] || 0;
  const compat = clamp(pers.compatBase + traitBonus + pathBonus + Math.round(rnd(-10, 10)));
  const income = Math.round(pers.incomeMin + Math.random() * (pers.incomeMax - pers.incomeMin));
  return {
    name,
    gender: partnerGender,
    personality: pers.key,
    compatibility: compat,
    income,
    yearsTogether: 0
  };
}
function generateParents(wealthTierLabel, countryKey) {
  const country = getCountry(countryKey);
  const names = getCountryNames(countryKey);
  const pool = PARENT_OCCUPATIONS[wealthTierLabel] || PARENT_OCCUPATIONS["Middle Class"];
  const makeParent = () => {
    const r = Math.random();
    const gender = r < 0.47 ? "male" : r < 0.94 ? "female" : "nb";
    const namePool = gender === "male" ? names.male : gender === "female" ? names.female : names.nb;
    const name = namePool[Math.floor(Math.random() * namePool.length)];
    const occ = pool[Math.floor(Math.random() * pool.length)];
    const income = Math.round(occ.incomeBase * country.payMult * rnd(0.85, 1.2));
    const age = 24 + Math.floor(Math.random() * 14);
    return {
      name,
      gender,
      occupation: occ.title,
      income,
      age,
      alive: true,
      diedAge: null
    };
  };
  return [makeParent(), makeParent()];
}

function computeLegacyScore(c) {
  const nw = c.netWorthPeak;
  const wealthPts = nw >= 10000000 ? 25 : nw >= 1000000 ? 22 : nw >= 500000 ? 17 : nw >= 100000 ? 11 : nw >= 10000 ? 5 : 2;
  const nt = c.politics.termsServed;
  const powerPts = nt.national >= 2 ? 25 : nt.national >= 1 ? 20 : nt.governor >= 1 ? 13 : nt.mayor >= 1 ? 7 : nt.council >= 1 ? 3 : 0;
  const happPts = Math.round(c.stats.happiness / 4);
  let lovePts = 0;
  if (c.rel.stage === "married") lovePts += 12;else if (c.rel.stage === "widowed") lovePts += 9;else if (c.rel.stage === "divorced") lovePts += 3;
  lovePts += Math.min(8, Math.floor((c.rel.partner?.yearsTogether || 0) / 3));
  lovePts += Math.min(5, c.rel.kids.length * 2);
  const loveFinal = Math.min(25, Math.round(lovePts));
  return Math.min(100, wealthPts + powerPts + happPts + loveFinal);
}
